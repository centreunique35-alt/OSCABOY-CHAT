<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Entreprise</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f0f2f5; }
    #login { max-width: 320px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 10px; }
    #login input, #login button { width: 100%; padding: 10px; margin-top: 10px; font-size: 16px; }
    #error { color: #c00; margin-top: 10px; min-height: 20px; }
    #chat { display: none; height: 100vh; }
    #sidebar { width: 200px; background: #075e54; color: #fff; padding: 12px; float: left; height: 100%; }
    #sidebar li { list-style: none; margin: 6px 0; }
    #sidebar ul { padding: 0; }
    #main { margin-left: 200px; height: 100%; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { background: #fff; padding: 8px 12px; border-radius: 8px; margin: 6px 0; max-width: 70%; }
    .msg.moi { background: #dcf8c6; margin-left: auto; }
    .msg b { font-size: 12px; color: #075e54; }
    #form { display: flex; padding: 10px; background: #ddd; }
    #form input { flex: 1; padding: 10px; font-size: 16px; }
    #form button { padding: 10px 18px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="login">
    <h2>Chat Entreprise</h2>
    <input id="user" placeholder="Nom d'utilisateur">
    <input id="pass" type="password" placeholder="Mot de passe">
    <button id="btnLogin">Se connecter</button>
    <button id="btnRegister">Créer un compte</button>
    <div id="error"></div>
  </div>

  <div id="chat">
    <div id="sidebar">
      <h3>En ligne</h3>
      <ul id="onlineList"></ul>
    </div>
    <div id="main">
      <div id="messages"></div>
      <form id="form">
        <input id="input" placeholder="Écris un message..." autocomplete="off">
        <button>Envoyer</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myName = '';

    function auth(eventName) {
      const username = document.getElementById('user').value;
      const password = document.getElementById('pass').value;
      socket.emit(eventName, { username, password }, (res) => {
        if (!res.ok) {
          document.getElementById('error').textContent = res.error;
          return;
        }
        myName = res.username;
        document.getElementById('login').style.display = 'none';
        document.getElementById('chat').style.display = 'block';
      });
    }
    document.getElementById('btnLogin').onclick = () => auth('login');
    document.getElementById('btnRegister').onclick = () => auth('register');

    socket.on('online', (names) => {
      const list = document.getElementById('onlineList');
      list.innerHTML = '';
      names.forEach((n) => {
        const li = document.createElement('li');
        li.textContent = '🟢 ' + n;
        list.appendChild(li);
      });
    });

    socket.on('message', (m) => {
      const div = document.createElement('div');
      div.className = 'msg' + (m.name === myName ? ' moi' : '');
      const b = document.createElement('b');
      b.textContent = m.name;
      const p = document.createElement('div');
      p.textContent = m.text;
      div.append(b, p);
      const box = document.getElementById('messages');
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    });

    document.getElementById('form').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('input');
      if (input.value.trim()) socket.emit('message', input.value);
      input.value = '';
    };
  </script>
</body>
</html>
